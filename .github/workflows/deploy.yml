name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    if: ${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_USER != '' && secrets.DEPLOY_PASSWORD != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate deploy secrets
        run: |
          test -n "${{ secrets.DEPLOY_HOST }}" || { echo "❌ DEPLOY_HOST is not set"; exit 1; }
          test -n "${{ secrets.DEPLOY_USER }}" || { echo "❌ DEPLOY_USER is not set"; exit 1; }
          test -n "${{ secrets.DEPLOY_PASSWORD }}" || { echo "❌ DEPLOY_PASSWORD is not set"; exit 1; }
          echo "✅ All deploy secrets are configured"

      - name: Deploy to production
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            cd /opt/ecodama/frontend
            git pull origin main
            cd deploy
            make frontend
