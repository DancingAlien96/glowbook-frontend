name: Deploy Frontend

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.DEPLOY_HOST }}" ] && [ -n "${{ secrets.DEPLOY_USER }}" ] && [ -n "${{ secrets.DEPLOY_PASSWORD }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "✅ All deploy secrets are configured"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping deploy because one or more deploy secrets are not configured."
          fi

      - name: Deploy to production
        if: steps.check_secrets.outputs.ready == 'true'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            cd /opt/ecodama/frontend
            git pull origin main
            cd deploy
            make frontend
