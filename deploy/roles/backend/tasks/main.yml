---
# Syncs source, templates the production compose file, builds and starts containers.

- name: Check if the MySQL container already exists (skip backup on the very first deploy)
  ansible.builtin.shell: docker ps -aq --filter "name=glowbook-mysql"
  register: mysql_container_check
  changed_when: false

- name: Ensure the backup directory exists
  ansible.builtin.file:
    path: /opt/ecodama/backups
    state: directory
    mode: "0750"
  when: mysql_container_check.stdout != ""

- name: Backup the database before this deploy touches anything
  # Runs BEFORE any migration gets a chance to run — if a migration ever
  # goes wrong again, there's always a snapshot from right before it.
  # Piped straight into openssl so the plaintext dump never touches disk —
  # glowbook-backend is a PUBLIC repo, and this backup contains real client
  # PII (names, emails, phone numbers), so only the encrypted .enc file is
  # ever written or leaves this server.
  ansible.builtin.shell: |
    set -o pipefail
    ts=$(date +%Y%m%d_%H%M%S)
    docker exec glowbook-mysql mysqldump -uroot -p{{ vault_mysql_root_password }} \
      --single-transaction --routines --triggers glowbook \
      | gzip \
      | openssl enc -aes-256-cbc -pbkdf2 -salt -pass pass:'{{ vault_backup_encryption_key }}' \
      > /opt/ecodama/backups/glowbook_${ts}.sql.gz.enc
  args:
    executable: /bin/bash
  when: mysql_container_check.stdout != ""
  changed_when: true

- name: Prune on-server backups, keep the last 14
  ansible.builtin.shell: |
    ls -1t /opt/ecodama/backups/glowbook_*.sql.gz.enc 2>/dev/null | tail -n +15 | xargs -r rm -f
  when: mysql_container_check.stdout != ""
  changed_when: false

- name: Find the backup just taken
  ansible.builtin.shell: ls -1t /opt/ecodama/backups/glowbook_*.sql.gz.enc 2>/dev/null | head -1
  register: latest_backup
  when: mysql_container_check.stdout != ""
  changed_when: false

- name: Fetch the encrypted backup off the server (uploaded as a CI artifact by the workflow)
  # The server is a single point of failure — a copy that only lives next to
  # the database it backs up isn't much of a safety net if that disk dies.
  # This pulls it onto the CI runner so deploy.yml can upload it to GitHub's
  # artifact storage, which is independent infrastructure. Safe to do even
  # though the repo is public: the file is AES-256 encrypted, decryptable
  # only with BACKUP_ENCRYPTION_KEY.
  #
  # To restore: openssl enc -d -aes-256-cbc -pbkdf2 -salt -pass pass:"$KEY" \
  #   -in glowbook_TIMESTAMP.sql.gz.enc | gunzip > glowbook.sql
  ansible.builtin.fetch:
    # Lands at {github.workspace}/backup-artifact/ — inside the backend
    # checkout dir, not a sibling via "..", because actions/upload-artifact
    # rejects ".." in its path input.
    src: "{{ latest_backup.stdout }}"
    dest: "{{ playbook_dir }}/../../glowbook-backend/backup-artifact/"
    flat: yes
  when: mysql_container_check.stdout != "" and latest_backup.stdout != ""

- name: Create backend directory
  ansible.builtin.file:
    path: "{{ backend_dir }}"
    state: directory
    mode: "0755"

- name: Sync backend source to server
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../../glowbook-backend/"
    dest: "{{ backend_dir }}/"
    rsync_opts:
      - "--exclude=node_modules"
      - "--exclude=dist"
      - "--exclude=.env"
      - "--exclude=uploads"
      - "--exclude=docker-compose.prod.yml"
    delete: yes

- name: Deploy production docker-compose
  ansible.builtin.template:
    src: docker-compose.prod.yml.j2
    dest: "{{ backend_dir }}/docker-compose.prod.yml"
    mode: "0640"

- name: Remove the current glowbook-api container so it's always created fresh
  # `docker compose up`'s in-place recreate (rename old -> temp name, create
  # new, remove temp) has repeatedly raced and failed on this server with
  # "container name already in use" — whether from a genuinely interrupted
  # previous run or from Compose's own bookkeeping. Side-step the whole
  # rename dance: just remove the container outright before building. It's
  # stateless (all real state lives in the mysql volume), so this is safe,
  # and `up -d` below creates it fresh with no rename step to race on.
  ansible.builtin.shell: |
    docker rm -f glowbook-api 2>/dev/null || true
    docker ps -aq --filter "name=_glowbook-api" | xargs -r docker rm -f
  changed_when: false

- name: Build and start backend stack
  ansible.builtin.shell: |
    docker compose -f {{ backend_dir }}/docker-compose.prod.yml up -d --build --remove-orphans
  register: compose_output
  changed_when: true

- name: Show compose output
  ansible.builtin.debug:
    var: compose_output.stderr_lines

- name: Wait for MySQL to be healthy
  ansible.builtin.shell: |
    docker exec glowbook-mysql \
      mysqladmin ping -h localhost -uroot -p{{ vault_mysql_root_password }} --silent
  register: mysql_health
  retries: 15
  delay: 8
  until: mysql_health.rc == 0

- name: Health-check the API before calling this deploy successful
  # Without this, a container that migrates/crashes and keeps restarting
  # (like tonight) deploys "successfully" from Ansible's point of view —
  # nothing here notices unless someone happens to hit the site. Fail the
  # whole workflow loudly (red X in GitHub) instead.
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ backend_port }}/api/health"
    status_code: 200
    timeout: 5
  register: api_health
  retries: 24
  delay: 5
  until: api_health.status is defined and api_health.status == 200
