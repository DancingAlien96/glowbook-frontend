---
# Syncs source, builds Next.js export (static files), and deploys via Nginx.

- name: Create frontend source directory
  ansible.builtin.file:
    path: "{{ frontend_dir }}"
    state: directory
    mode: "0755"

- name: Create Nginx static files directory
  ansible.builtin.file:
    path: "/var/www/ecodama"
    state: directory
    mode: "0755"
    owner: "www-data"
    group: "www-data"

- name: Sync frontend source to server
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../"
    dest: "{{ frontend_dir }}/"
    rsync_opts:
      - "--exclude=node_modules"
      - "--exclude=.next"
      - "--exclude=out"
      - "--exclude=.env.local"
      - "--exclude=deploy/"
      - "--exclude=playwright-report/"
      - "--exclude=test-results/"
    delete: yes

- name: Deploy frontend .env.local
  ansible.builtin.template:
    src: env.local.j2
    dest: "{{ frontend_dir }}/.env.local"
    mode: "0640"

- name: Install npm dependencies
  ansible.builtin.shell: |
    cd {{ frontend_dir }} && npm ci
  changed_when: true

- name: Build Next.js (standalone)
  ansible.builtin.shell: |
    cd {{ frontend_dir }} && npm run build
  changed_when: true

- name: Deploy standalone build to /var/www/ecodama
  ansible.builtin.shell: |
    rm -rf /var/www/ecodama/*
    cp -r {{ frontend_dir }}/.next/standalone/. /var/www/ecodama/
    cp -r {{ frontend_dir }}/public /var/www/ecodama/public
    mkdir -p /var/www/ecodama/.next/static
    cp -r {{ frontend_dir }}/.next/static/. /var/www/ecodama/.next/static/
    chown -R www-data:www-data /var/www/ecodama
  changed_when: true

- name: Ensure systemd service for frontend exists
  ansible.builtin.copy:
    dest: /etc/systemd/system/ecodama-frontend.service
    mode: "0644"
    content: |
      [Unit]
      Description=Ecodama Frontend (Next.js)
      After=network.target

      [Service]
      WorkingDirectory=/var/www/ecodama
      ExecStart=/usr/bin/node server.js
      Restart=always
      RestartSec=5
      User=www-data
      Environment=NODE_ENV=production
      Environment=PORT=3000

      [Install]
      WantedBy=multi-user.target

- name: Enable and restart frontend service
  ansible.builtin.systemd:
    name: ecodama-frontend
    enabled: true
    state: restarted
    daemon_reload: true
