---
# Syncs source, builds Next.js export (static files), and deploys via Nginx.

- name: Create frontend source directory
  ansible.builtin.file:
    path: "{{ frontend_dir }}"
    state: directory
    mode: "0755"

- name: Create Nginx static files directory
  ansible.builtin.file:
    path: "/var/www/ecodama"
    state: directory
    mode: "0755"
    owner: "www-data"
    group: "www-data"

- name: Sync frontend source to server
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../"
    dest: "{{ frontend_dir }}/"
    rsync_opts:
      - "--exclude=node_modules"
      - "--exclude=.next"
      - "--exclude=out"
      - "--exclude=.env.local"
      - "--exclude=deploy/"
      - "--exclude=playwright-report/"
      - "--exclude=test-results/"
    delete: yes

- name: Deploy frontend .env.local
  ansible.builtin.template:
    src: env.local.j2
    dest: "{{ frontend_dir }}/.env.local"
    mode: "0640"

- name: Install npm dependencies
  ansible.builtin.shell: |
    cd {{ frontend_dir }} && npm ci
  changed_when: true

- name: Clear any stuck Next.js build lock from a previous interrupted deploy
  # .next/ is excluded from the source sync above so it survives between
  # deploys — which means a build interrupted mid-way (killed runner,
  # dropped SSH session, etc.) can leave its "another build is already
  # running" lock behind and block every deploy after it, even though
  # nothing is actually building anymore. Just drop the whole directory —
  # it's a build artifact, not state — so the next build starts clean.
  # (Deliberately NOT pkill-ing "next build": that pattern also matches
  # this very shell's own invocation text and kills itself instead.)
  ansible.builtin.shell: |
    rm -rf {{ frontend_dir }}/.next
  changed_when: false

- name: Build Next.js (standalone)
  ansible.builtin.shell: |
    cd {{ frontend_dir }} && npm run build
  changed_when: true

- name: Deploy standalone build to /var/www/ecodama
  ansible.builtin.shell: |
    rm -rf /var/www/ecodama/*
    cp -r {{ frontend_dir }}/.next/standalone/. /var/www/ecodama/
    cp -r {{ frontend_dir }}/public /var/www/ecodama/public
    mkdir -p /var/www/ecodama/.next/static
    cp -r {{ frontend_dir }}/.next/static/. /var/www/ecodama/.next/static/
    chown -R www-data:www-data /var/www/ecodama
  changed_when: true

- name: Stop conflicting systemd service if active
  ansible.builtin.systemd:
    name: ecodama-frontend
    enabled: false
    state: stopped
    daemon_reload: true
  failed_when: false

- name: Reload frontend with PM2
  ansible.builtin.shell: |
    pm2 describe ecodama-frontend > /dev/null 2>&1 \
      && pm2 reload ecodama-frontend \
      || pm2 start /var/www/ecodama/server.js \
           --name ecodama-frontend \
           --env production \
           -- --port 3000
    pm2 save
  environment:
    NODE_ENV: production
    PORT: "3000"
  changed_when: true
