---
# Syncs source, builds Next.js export (static files), and deploys via Nginx.

- name: Create frontend source directory
  ansible.builtin.file:
    path: "{{ frontend_dir }}"
    state: directory
    mode: "0755"

- name: Create Nginx static files directory
  ansible.builtin.file:
    path: "/var/www/ecodama"
    state: directory
    mode: "0755"
    owner: "www-data"
    group: "www-data"

- name: Sync frontend source to server
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../"
    dest: "{{ frontend_dir }}/"
    rsync_opts:
      - "--exclude=node_modules"
      - "--exclude=.next"
      - "--exclude=out"
      - "--exclude=.env.local"
      - "--exclude=deploy/"
      - "--exclude=playwright-report/"
      - "--exclude=test-results/"
    delete: yes

- name: Verify the synced source matches the commit CI meant to deploy
  # Guards against a real incident: the deploy workflow clones this repo
  # fresh from GitHub on every run, but only triggers on BACKEND pushes.
  # If a frontend push lands within moments of the backend push that
  # kicks off a run, the clone can race ahead of it and silently sync an
  # older frontend commit — the rest of the pipeline (build, PM2 reload,
  # health check) all "succeed" against that stale content because none
  # of them check *which* commit actually got deployed. This turns that
  # class of failure into a loud, red CI job instead of a silent one.
  # Only runs when the caller passes expected_frontend_sha (CI does; a
  # plain `ansible-playbook site.yml` run without it skips the check).
  when: expected_frontend_sha is defined
  block:
    - name: Read the git commit synced to the server
      # -c safe.directory=... scopes the "trust this repo" exception to just
      # this one command, instead of a global git config change on the box.
      # Needed because rsync preserves ownership from the source side, which
      # doesn't necessarily match the SSH user running this command.
      ansible.builtin.command: git -c safe.directory={{ frontend_dir }} -C {{ frontend_dir }} rev-parse HEAD
      register: synced_frontend_sha
      changed_when: false

    - name: Fail loudly if the server has a different commit than CI cloned
      ansible.builtin.assert:
        that: synced_frontend_sha.stdout == expected_frontend_sha
        fail_msg: >-
          Frontend source on the server ({{ synced_frontend_sha.stdout }})
          does not match the commit this deploy was meant to ship
          ({{ expected_frontend_sha }}). Most likely cause: a frontend
          push landed right around the same time as the backend push
          that triggered this run, and the repo clone raced ahead of it.
          Re-run the deploy (workflow_dispatch) — the frontend repo has
          since settled and the next clone will pick up the right commit.
        success_msg: "Confirmed: server has the intended frontend commit."

- name: Deploy frontend .env.local
  ansible.builtin.template:
    src: env.local.j2
    dest: "{{ frontend_dir }}/.env.local"
    mode: "0640"

- name: Install npm dependencies
  ansible.builtin.shell: |
    cd {{ frontend_dir }} && npm ci
  changed_when: true

- name: Clear any stuck Next.js build lock from a previous interrupted deploy
  # .next/ is excluded from the source sync above so it survives between
  # deploys — which means a build interrupted mid-way (killed runner,
  # dropped SSH session, etc.) can leave its "another build is already
  # running" lock behind and block every deploy after it, even though
  # nothing is actually building anymore. Just drop the whole directory —
  # it's a build artifact, not state — so the next build starts clean.
  # (Deliberately NOT pkill-ing "next build": that pattern also matches
  # this very shell's own invocation text and kills itself instead.)
  ansible.builtin.shell: |
    rm -rf {{ frontend_dir }}/.next
  changed_when: false

- name: Build Next.js (standalone)
  ansible.builtin.shell: |
    cd {{ frontend_dir }} && npm run build
  changed_when: true

- name: Deploy standalone build to /var/www/ecodama
  ansible.builtin.shell: |
    rm -rf /var/www/ecodama/*
    cp -r {{ frontend_dir }}/.next/standalone/. /var/www/ecodama/
    cp -r {{ frontend_dir }}/public /var/www/ecodama/public
    mkdir -p /var/www/ecodama/.next/static
    cp -r {{ frontend_dir }}/.next/static/. /var/www/ecodama/.next/static/
    chown -R www-data:www-data /var/www/ecodama
  changed_when: true

- name: Stop conflicting systemd service if active
  ansible.builtin.systemd:
    name: ecodama-frontend
    enabled: false
    state: stopped
    daemon_reload: true
  failed_when: false

- name: Reload frontend with PM2
  ansible.builtin.shell: |
    pm2 describe ecodama-frontend > /dev/null 2>&1 \
      && pm2 reload ecodama-frontend \
      || pm2 start /var/www/ecodama/server.js \
           --name ecodama-frontend \
           --env production \
           -- --port 3000
    pm2 save
  environment:
    NODE_ENV: production
    PORT: "3000"
  changed_when: true
