---
# Syncs source, builds Next.js export (static files), and deploys via Nginx.

- name: Create frontend source directory
  ansible.builtin.file:
    path: "{{ frontend_dir }}"
    state: directory
    mode: "0755"

- name: Create Nginx static files directory
  ansible.builtin.file:
    path: "/var/www/ecodama"
    state: directory
    mode: "0755"
    owner: "www-data"
    group: "www-data"

- name: Sync frontend source to server
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../"
    dest: "{{ frontend_dir }}/"
    rsync_opts:
      - "--exclude=node_modules"
      - "--exclude=.next"
      - "--exclude=out"
      - "--exclude=.env.local"
      - "--exclude=deploy/"
      - "--exclude=playwright-report/"
      - "--exclude=test-results/"
    delete: yes

- name: Deploy frontend .env.local
  ansible.builtin.template:
    src: env.local.j2
    dest: "{{ frontend_dir }}/.env.local"
    mode: "0640"

- name: Install npm dependencies
  ansible.builtin.shell: |
    cd {{ frontend_dir }} && npm ci
  changed_when: true

- name: Build Next.js (export static files)
  ansible.builtin.shell: |
    cd {{ frontend_dir }} && npm run build
  changed_when: true

- name: Copy static files to Nginx directory
  ansible.builtin.shell: |
    rm -rf /var/www/ecodama/*
    cp -r {{ frontend_dir }}/out/* /var/www/ecodama/
    chown -R www-data:www-data /var/www/ecodama
  changed_when: true

- name: Stop PM2 frontend process (if running)
  ansible.builtin.shell: |
    pm2 describe ecodama-frontend > /dev/null 2>&1 && pm2 delete ecodama-frontend || true
  changed_when: true

- name: Save PM2 process list
  ansible.builtin.shell: pm2 save
  changed_when: false
